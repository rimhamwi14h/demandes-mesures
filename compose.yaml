services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: mesures
      POSTGRES_PASSWORD: mesures_dev
      POSTGRES_DB: demandes_mesures
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesures -d demandes_mesures"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: